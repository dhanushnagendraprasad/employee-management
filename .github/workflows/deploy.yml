name: Build and Deploy to Home Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd $HOME/employee-management
          git fetch origin
          git reset --hard origin/main

      - name: Run Automated Test Suite
        run: |
          cd $HOME/employee-management
          mvn test

      - name: Build JAR with Maven
        run: |
          cd $HOME/employee-management
          mvn package

      - name: Build Frontend with Vite
        run: |
          cd $HOME/employee-management/frontend
          npm ci
          npm run build

      - name: Restart Spring Boot Service
        run: |
          sudo systemctl restart employee-management
          sleep 5
          sudo systemctl status employee-management --no-pager