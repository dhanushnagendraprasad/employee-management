spring.application.name=employee-management-dev
server.port=8082

# --- Dev Database Configuration (Isolated from Prod) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/employee_management_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# --- Logging ---
logging.file.name=logs/employee-management-dev.log
logging.level.root=INFO
logging.level.com.example.employee_management=DEBUG
logging.level.org.springframework.security=DEBUG

# --- JWT Configuration ---
jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyThatMustBeAtLeast32CharactersLong}
jwt.expiration=86400000

# --- Swagger / OpenAPI Config ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true
server.forward-headers-strategy=framework
