spring.application.name=employee-management
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging configuration
logging.file.name=logs/employee-management.log
logging.level.root=INFO
logging.level.com.example.employee_management=INFO

# JWT config
jwt.secret=ReplaceThisWithAStrongSecretKey12345
jwt.expirationMs=86400000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# jwt secret (if you want to read from props)
jwt.secret=thisIsASecretKeyForJwtSigningThatShouldBeLongEnough
jwt.expirationMs=86400000

# debug logs for troubleshooting
logging.level.org.springframework.security=DEBUG
logging.level.com.example.employee_management=DEBUG
