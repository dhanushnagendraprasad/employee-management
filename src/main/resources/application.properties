spring.application.name=employee-management
server.port=8080

# --- Database Configuration ---
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# This allows DataSeeder to run SQL scripts if needed (optional)
spring.jpa.defer-datasource-initialization=true

# --- Logging ---
logging.file.name=logs/employee-management.log
logging.level.root=INFO
logging.level.com.example.employee_management=DEBUG
logging.level.org.springframework.security=DEBUG

# --- JWT Configuration ---
# Secret key must be consistent (use this one)
jwt.secret=ThisIsAVeryLongSecretKeyThatMustBeAtLeast32CharactersLong
# Expiration: 24 hours (in milliseconds)
# MATCHES Java @Value("${jwt.expiration}")
jwt.expiration=86400000

# ... existing config ...

# --- Swagger / OpenAPI Config ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true
server.port=8081
