# Test Configuration - Uses H2 in-memory database
spring.application.name=employee-management-test

# --- H2 Database Configuration (In-Memory for Testing) ---
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# --- Logging ---
logging.level.root=WARN
logging.level.com.example.employee_management=DEBUG
logging.level.org.springframework.security=DEBUG

# --- JWT Configuration ---
jwt.secret=ThisIsAVeryLongSecretKeyThatMustBeAtLeast32CharactersLong
jwt.expiration=86400000

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true
spring.sql.init.mode=never
